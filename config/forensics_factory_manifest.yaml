    data_lake_roots:
      - "/root/HyperFFactory/data"
  smartfriend:
    # التكامل مستقبلاً سيكون عبر بوتات تليجرام و/أو API Gateway فقط
    via_bots: true
    via_gateway: true

status: "discovered"
notes: |
  هذا المصنع مأخوذ من SMARTFRIEND_TARGETED_BACKUP
  ويتم التعامل معه كمنصة تحليل جنائي/سلوكي مستقلة بهويتها.
  لا يتم تغيير مساراته أو أسمائه، فقط تعريفه داخل HyperFFactory
  واستخدامه كمصدر قدرات (Forensics / Behavior / AI Engines) عند الحاجة.
